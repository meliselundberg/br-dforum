<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brödregn</title>
  <link rel="stylesheet" href="brodregn.css">
</head>

<body>
  <div class="page-bg">
    <div class="floating floating-1">🥐</div>
    <div class="floating floating-2">🍞</div>
    <div class="floating floating-3">🥖</div>
    <div class="floating floating-4">✨</div>
    <div class="floating floating-5">💗</div>
  </div>

  <main class="game-shell">
    <button class="back-button" onclick="window.location.href='index.html'">
      ← Tillbaka till forumet
    </button>

    <section class="game-card">
      <header class="game-header">
        <div class="badge">Bread Giveaway presenterar</div>
        <h1>Brödregn</h1>
        <p>
          Fånga 50 glada bröd i korgen. Missa inte tre bröd och akta dig för soporna.
        </p>
      </header>

      <div class="game-area">
        <div class="game-hud">
          <div class="hud-bubble">
            <span>Fångade</span>
            <strong id="score">0 / 50</strong>
          </div>

          <div class="hud-bubble">
            <span>Missade</span>
            <strong id="misses">0 / 3</strong>
          </div>
        </div>

        <canvas id="gameCanvas" width="900" height="640"></canvas>
      </div>

      <div class="game-controls">
        <button id="startButton" class="cute-button">Starta brödregnet</button>

        <div class="instructions">
          <strong>Dator:</strong> styr med ← och →.
          <br>
          <strong>Mobil:</strong> dra korgen med fingret.
        </div>
      </div>
    </section>
  </main>

  <div id="gameModal" class="modal">
    <div class="modal-card">
      <div class="modal-sparkles">✨ 🥐 ✨</div>
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalText" class="modal-text"></div>

      <div class="modal-buttons">
        <button id="restartButton" class="cute-button">Spela igen</button>
        <button class="cute-button brown" onclick="window.location.href='index.html'">
          Tillbaka till forumet
        </button>
      </div>
    </div>
  </div>

  <script src="brodregn.js?v=6"></script>
</body>
</html>
